name: Publicar MORRISON en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: morrison-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript, HTML y manifiesto antes de publicar
        run: |
          node --check morrison-ops.js
          node --check morrison-connect.js
          node --check morrison-voice.js
          node --check sw.js
          python3 - <<'PY'
          import json,re,subprocess,pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert '<script src="./morrison-ops.js?v=120"></script>' in html
          assert 'MORRISON_BRIDGE' in html
          assert 'index.html' in pathlib.Path('sw.js').read_text()
          for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)):
              path=pathlib.Path('/tmp/morrison-inline-'+str(i)+'.js')
              path.write_text(script,encoding='utf-8')
              subprocess.run(['node','--check',str(path)],check=True)
          manifest=json.loads(pathlib.Path('manifest.webmanifest').read_text())
          assert manifest['name'].startswith('MORRISON')
          for entry in manifest['icons']: assert pathlib.Path(entry['src']).exists()
          print('MORRISON: validación estática correcta')
          PY
      - name: Validar flujo MORRISON de solo lectura
        run: node tests/n8n-health.mjs
      - name: Comprobar gateway Railway y protección de datos
        run: node tests/remote-health.mjs
      - name: Instalar Chromium para pruebas de interfaz
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar proyectos, tareas, economía y navegación
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/morrison-http.log 2>&1 &
          node tests/smoke.mjs
          node tests/mobile.mjs
          node tests/voice.mjs
          node tests/sync.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
