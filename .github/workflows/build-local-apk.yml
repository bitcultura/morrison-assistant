name: Compilar MORRISON Local APK sin servidor
on:
  workflow_dispatch:
  push:
    paths:
      - 'local-android/**'
      - '.github/workflows/build-local-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK gratuito
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK sin servicios remotos
        working-directory: local-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Verificar APK
        run: |
          test -s local-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l local-android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
          sha256sum local-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK instalable como artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: MORRISON-Local-Android-APK
          path: local-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30